[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sodium-digitizer"
version = "0.4.0"
description = "Reproducible digitization, auditable curve cleaning, manual validation, and PCHIP resampling pipeline for Sodium"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.26", "pandas>=2.0", "scipy>=1.11"]

[project.scripts]
sodium-digitizer = "sodium_digitizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sodium_digitizer*"]
